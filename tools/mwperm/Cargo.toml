[package]
name = "mwperm"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
rayon = "1"
regex = "1"
sha1 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
